<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CartShare — Printable receipt for your shared shopping cart room.">
  <title>CartShare — Receipt</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- CartShare -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="cs-navbar navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-cart-check-fill"></i> CartShare
      </a>
      <div class="d-flex gap-2">
        <a id="btn-back-to-room" href="room.html" class="btn btn-cs-outline btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Back to Room
        </a>
        <button class="btn btn-cs-primary btn-sm" id="btn-print">
          <i class="bi bi-printer me-1"></i> Print Receipt
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="receipt-content">
    <div class="cs-receipt">
      <!-- Receipt Header -->
      <div class="text-center mb-4">
        <h2><i class="bi bi-cart-check-fill"></i> CartShare Receipt</h2>
        <p class="mb-1">
          <strong>Room:</strong> <span id="receipt-room-code" class="cs-room-code" style="font-size: 1.1rem;"></span>
        </p>
        <p class="text-muted mb-0">
          <strong>Generated:</strong> <span id="receipt-date"></span>
        </p>
      </div>

      <hr style="border-color: var(--cs-border);">

      <!-- Participants -->
      <div class="mb-4">
        <h5><i class="bi bi-people me-1"></i> Participants</h5>
        <ul id="receipt-participants" class="list-unstyled ms-3"></ul>
      </div>

      <!-- Itemised Table -->
      <div class="mb-4">
        <h5><i class="bi bi-list-check me-1"></i> Items</h5>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Line Total</th>
                <th>Added By</th>
              </tr>
            </thead>
            <tbody id="receipt-items-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Subtotal -->
      <div class="cs-subtotal-bar mb-3">
        <span class="label">Subtotal</span>
        <span class="value" id="receipt-subtotal">$0.00</span>
      </div>

      <!-- Delivery Status -->
      <div class="mb-4">
        <p id="receipt-delivery"></p>
      </div>

      <!-- Per-person Breakdown -->
      <div class="mb-4">
        <h5><i class="bi bi-pie-chart me-1"></i> Per-Person Breakdown</h5>
        <table class="table">
          <thead>
            <tr>
              <th>Person</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="receipt-breakdown-body"></tbody>
        </table>
      </div>

      <!-- Activity Summary -->
      <div class="mb-4">
        <h5><i class="bi bi-clock-history me-1"></i> Recent Activity</h5>
        <ul id="receipt-log" class="list-unstyled ms-3" style="font-size: 0.9rem;"></ul>
      </div>

      <hr style="border-color: var(--cs-border);">
      <p class="text-center text-muted small">
        Generated by CartShare &mdash; cartshare.app
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="cs-footer">
    <span>CartShare &copy; 2026</span>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/receipt.js"></script>

</body>
</html>
