<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CartShare — A collaborative shopping cart for groups. Create or join a room and shop together in real time.">
  <title>CartShare — Collaborative Shopping Cart</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- CartShare -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="cs-navbar navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-cart-check-fill"></i> CartShare
      </a>
    </div>
  </nav>

  <!-- Auth Form -->
  <main class="cs-auth-wrapper">
    <div class="cs-auth-card cs-card">
      <div class="cs-card-body">
        <div class="cs-auth-hero">
          <h1><i class="bi bi-cart-check-fill"></i> CartShare</h1>
          <p>Shop together. Split fairly. Deliver free.</p>
        </div>

        <!-- Global alert (e.g. redirect message) -->
        <div id="global-alert" class="alert d-none" role="alert"></div>

        <form id="auth-form" novalidate>
          <!-- Display Name -->
          <div class="mb-3">
            <label for="display-name" class="form-label">Display Name</label>
            <input type="text" class="form-control" id="display-name"
                   placeholder="e.g. Alex" maxlength="30" autocomplete="off" required>
            <div id="name-error" class="invalid-feedback"></div>
          </div>

          <!-- Room Code -->
          <div class="mb-4">
            <label for="room-code" class="form-label">Room Code <small class="text-muted">(to join an existing room)</small></label>
            <input type="text" class="form-control" id="room-code"
                   placeholder="e.g. ABX7K2" maxlength="6" autocomplete="off"
                   style="text-transform: uppercase; letter-spacing: 3px; font-weight: 700;">
            <div id="code-error" class="invalid-feedback"></div>
          </div>

          <!-- Action Buttons -->
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-cs-primary" id="btn-create">
              <i class="bi bi-plus-circle me-1"></i> Create New Room
            </button>
            <button type="button" class="btn btn-cs-accent" id="btn-join">
              <i class="bi bi-box-arrow-in-right me-1"></i> Join Room
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="cs-footer">
    <span>CartShare &copy; 2026 &mdash; Collaborative shopping, simplified.</span>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
